name: Temporary PlakUi catalog patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/plakui-catalog-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch PlakUi supported-games catalog
        shell: python
        run: |
          from pathlib import Path

          path = Path("PlakUi.lua")
          source = path.read_text(encoding="utf-8")

          old_services = '''    Text = game:GetService("TextService"),
          }'''
          new_services = '''    Text = game:GetService("TextService"),
              Http = game:GetService("HttpService"),
          }'''
          if old_services not in source:
              raise SystemExit("Services anchor not found")
          source = source.replace(old_services, new_services, 1)

          old_catalog = '''local Cards = {}
          -- Supported experiences are configured here, not fetched from a remote catalog.
          local function productName(product)'''
          new_catalog = '''local Cards = {}
          local SUPPORTED_GAMES_URL = "https://raw.githubusercontent.com/Nanana291/Plak/main/Games.json"
          local SupportedGamesFallback = {
              { Id = "roll-a-fisherman", GameId = 90920025162454, FallbackName = "Roll a Fisherman", Status = "Available" },
          }
          local function loadSupportedGames()
              local fetched, response = pcall(function()
                  return game:HttpGet(SUPPORTED_GAMES_URL)
              end)
              if fetched and type(response) == "string" and response ~= "" then
                  local decodedOk, decoded = pcall(Services.Http.JSONDecode, Services.Http, response)
                  if decodedOk and type(decoded) == "table" then
                      local catalog = {}
                      for _, config in ipairs(decoded) do
                          if type(config) == "table" then
                              catalog[#catalog + 1] = config
                          end
                      end
                      if #catalog > 0 or next(decoded) == nil then
                          return catalog
                      end
                  end
              end
              warn("[PlakUi] Failed to load supported games from Games.json; using fallback catalog")
              return SupportedGamesFallback
          end
          local function productName(product)'''
          if old_catalog not in source:
              raise SystemExit("Catalog anchor not found")
          source = source.replace(old_catalog, new_catalog, 1)

          old_hardcoded = '''local SupportedGames = {
              { Id = "roll-a-fisherman", GameId = 90920025162454, FallbackName = "Roll a Fisherman", Status = "Available" },
          }
          '''
          if old_hardcoded not in source:
              raise SystemExit("Hardcoded catalog block not found")
          source = source.replace(old_hardcoded, "", 1)

          old_refresh = '''        else
                      Cards:Rebuild()
                      Loader:Toast({ Type = "info", Title = Localization:Get("refreshed"), Duration = 2 })
                  end'''
          new_refresh = '''        else
                      Loader:SetProducts(loadSupportedGames())
                      Loader:Toast({ Type = "info", Title = Localization:Get("refreshed"), Duration = 2 })
                  end'''
          if old_refresh not in source:
              raise SystemExit("Refresh anchor not found")
          source = source.replace(old_refresh, new_refresh, 1)

          old_initialize = "    Loader:SetProducts(SupportedGames)"
          new_initialize = "    Loader:SetProducts(loadSupportedGames())"
          if old_initialize not in source:
              raise SystemExit("Initialize anchor not found")
          source = source.replace(old_initialize, new_initialize, 1)

          path.write_text(source, encoding="utf-8")

      - name: Commit catalog integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PlakUi.lua
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Load supported games from remote Games.json"
          git push
